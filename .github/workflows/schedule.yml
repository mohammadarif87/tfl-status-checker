name: Check TFL Line Status

on:
  workflow_dispatch:
  schedule:
    # Cron times are interpreted in Europe/London (DST-aware). Six runs Mon–Fri.
    - cron: '15 7 * * 1-5'
      timezone: Europe/London
    - cron: '0 8 * * 1-5'
      timezone: Europe/London
    - cron: '45 8 * * 1-5'
      timezone: Europe/London
    - cron: '30 16 * * 1-5'
      timezone: Europe/London
    - cron: '15 17 * * 1-5'
      timezone: Europe/London
    - cron: '0 18 * * 1-5'
      timezone: Europe/London

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh jq
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Determine cache date and run slot
        id: slot
        run: |
          CACHE_DATE=$(date -u +%Y%m%d)
          echo "CACHE_DATE=$CACHE_DATE" >> $GITHUB_ENV

          # Which cron fired (github.event.schedule). Times are Europe/London when using timezone: above.
          case '${{ github.event.schedule }}' in
            '15 7 * * 1-5')  echo "SCHEDULE_NOTE=07:15 Europe/London" >> $GITHUB_ENV ;;
            '0 8 * * 1-5')   echo "SCHEDULE_NOTE=08:00 Europe/London" >> $GITHUB_ENV ;;
            '00 8 * * 1-5')  echo "SCHEDULE_NOTE=08:00 Europe/London" >> $GITHUB_ENV ;;
            '45 8 * * 1-5')  echo "SCHEDULE_NOTE=08:45 Europe/London" >> $GITHUB_ENV ;;
            '30 16 * * 1-5') echo "SCHEDULE_NOTE=16:30 Europe/London" >> $GITHUB_ENV ;;
            '15 17 * * 1-5') echo "SCHEDULE_NOTE=17:15 Europe/London" >> $GITHUB_ENV ;;
            '0 18 * * 1-5')  echo "SCHEDULE_NOTE=18:00 Europe/London" >> $GITHUB_ENV ;;
            '00 18 * * 1-5') echo "SCHEDULE_NOTE=18:00 Europe/London" >> $GITHUB_ENV ;;
            *)
              S='${{ github.event.schedule }}'
              if [ -n "$S" ]; then echo "SCHEDULE_NOTE=Cron $S (see workflow timezone)" >> $GITHUB_ENV; else echo "SCHEDULE_NOTE=" >> $GITHUB_ENV; fi
              ;;
          esac

          # Morning/evening from London hour (matches local cron buckets)
          HOUR=$(TZ=Europe/London date +%H)
          if [ "$HOUR" -lt 12 ]; then
            BLOCK="morning"
          else
            BLOCK="evening"
          fi
          echo "BLOCK=$BLOCK" >> $GITHUB_ENV

          PREFIX="${{ runner.os }}-previous-disruptions-${CACHE_DATE}-${BLOCK}-"
          COUNT=$(gh cache list --key "$PREFIX" --json id --jq '.[].id' | wc -l | tr -d ' ')
          if [ -z "$COUNT" ]; then COUNT=0; fi
          RUN_SLOT=$((COUNT + 1))
          echo "RUN_SLOT=$RUN_SLOT" >> $GITHUB_ENV
          echo "slot=$RUN_SLOT" >> $GITHUB_OUTPUT
          echo "block=$BLOCK" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}

      - name: Cache previous disruptions
        uses: actions/cache@v5
        id: cache
        with:
          path: previous_disruptions.json
          key: ${{ runner.os }}-previous-disruptions-${{ env.CACHE_DATE }}-${{ env.BLOCK }}-${{ env.RUN_SLOT }}
          restore-keys: |
            ${{ runner.os }}-previous-disruptions-${{ env.CACHE_DATE }}-${{ env.BLOCK }}-

      - name: Debug cache status
        run: |
          echo "Cache hit status: ${{ steps.cache.outputs.cache-hit }}"
          echo "Cache key: ${{ steps.cache.outputs.cache-primary-key }}"
          echo "Checking if previous_disruptions.json exists:"
          ls -la previous_disruptions.json || echo "File does not exist"
          if [ -f previous_disruptions.json ]; then
            echo "File contents:"
            cat previous_disruptions.json
          fi

      - name: Create empty previous disruptions file if not cached
        run: |
          if [ ! -f previous_disruptions.json ]; then
            echo "Cache miss - creating empty previous disruptions file"
            echo '[]' > previous_disruptions.json
          else
            echo "Cache hit - previous_disruptions.json already exists"
          fi

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: |
          echo "Debug: CACHE_DATE=$CACHE_DATE, BLOCK=$BLOCK, RUN_SLOT=$RUN_SLOT"
          echo "Debug: github.event.schedule=${{ github.event.schedule }} SCHEDULE_NOTE=$SCHEDULE_NOTE"
          node checkTflApi.js
        env:
          SLACK_BOT_TFL_TOKEN: ${{ secrets.SLACK_BOT_TFL_TOKEN }}
          SLACK_CHANNEL_TFL: ${{ secrets.SLACK_CHANNEL_TFL }}
          RUN_SLOT: ${{ env.RUN_SLOT }}
          BLOCK: ${{ env.BLOCK }}
          SCHEDULE_NOTE: ${{ env.SCHEDULE_NOTE }}

      - name: Save previous disruptions to cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: previous_disruptions.json
          key: ${{ runner.os }}-previous-disruptions-${{ env.CACHE_DATE }}-${{ env.BLOCK }}-${{ env.RUN_SLOT }}
          upload-chunk-size: 32MB

      - name: Delete cache for specific runs
        if: always() && env.RUN_SLOT == '3'
        run: |
          echo "Deleting all caches for ${{ env.BLOCK }} block..."
          CACHE_PREFIX="${{ runner.os }}-previous-disruptions-${{ env.CACHE_DATE }}-${{ env.BLOCK }}-"
          gh cache list --key "$CACHE_PREFIX" --json id --jq '.[].id' | while read -r cache_id; do
            echo "Deleting cache ID: $cache_id"
            gh cache delete "$cache_id"
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
