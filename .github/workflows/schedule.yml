name: Check TFL Line Status

on:
  workflow_dispatch:
    inputs:
      schedule_note:
        description: 'Scheduled time note (e.g. 07:15 Europe/London)'
        required: false
        default: ''
  schedule:
    # GitHub Actions cron schedules are strictly UTC and do not support timezone-aware run configurations.
    # The following UTC times correspond to local BST (UTC+1) target times (07:15, 08:00, 08:45, 16:30, 17:15, 18:00).
    - cron: '15 6 * * 1-5'
    - cron: '0 7 * * 1-5'
    - cron: '45 7 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '15 16 * * 1-5'
    - cron: '0 17 * * 1-5'

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh jq
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Determine cache date and run slot
        id: slot
        run: |
          CACHE_DATE=$(date -u +%Y%m%d)
          echo "CACHE_DATE=$CACHE_DATE" >> $GITHUB_ENV

          # Set SCHEDULE_NOTE from input, schedule event, or dynamically from the current hour
          if [ -n "${{ github.event.inputs.schedule_note }}" ]; then
            SCHEDULE_NOTE="${{ github.event.inputs.schedule_note }}"
          elif [ -n "${{ github.event.schedule }}" ]; then
            case '${{ github.event.schedule }}' in
              '15 6 * * 1-5')  SCHEDULE_NOTE="07:15 Europe/London" ;;
              '0 7 * * 1-5')   SCHEDULE_NOTE="08:00 Europe/London" ;;
              '00 7 * * 1-5')  SCHEDULE_NOTE="08:00 Europe/London" ;;
              '45 7 * * 1-5')  SCHEDULE_NOTE="08:45 Europe/London" ;;
              '30 15 * * 1-5') SCHEDULE_NOTE="16:30 Europe/London" ;;
              '15 16 * * 1-5') SCHEDULE_NOTE="17:15 Europe/London" ;;
              '0 17 * * 1-5')  SCHEDULE_NOTE="18:00 Europe/London" ;;
              '00 17 * * 1-5') SCHEDULE_NOTE="18:00 Europe/London" ;;
              *) SCHEDULE_NOTE="Cron ${{ github.event.schedule }}" ;;
            esac
          else
            # Triggered via workflow_dispatch without input. Determine closest slot based on current London time.
            NOW_TIME=$(TZ=Europe/London date +%H%M)
            # Remove leading zeros so bash handles it as a base-10 integer
            T=$(echo "$NOW_TIME" | sed 's/^0*//')
            if [ -z "$T" ]; then T=0; fi

            if [ "$T" -ge 700 ] && [ "$T" -le 737 ]; then
              SCHEDULE_NOTE="07:15 Europe/London"
            elif [ "$T" -gt 737 ] && [ "$T" -le 822 ]; then
              SCHEDULE_NOTE="08:00 Europe/London"
            elif [ "$T" -gt 822 ] && [ "$T" -le 930 ]; then
              SCHEDULE_NOTE="08:45 Europe/London"
            elif [ "$T" -ge 1600 ] && [ "$T" -le 1652 ]; then
              SCHEDULE_NOTE="16:30 Europe/London"
            elif [ "$T" -gt 1652 ] && [ "$T" -le 1737 ]; then
              SCHEDULE_NOTE="17:15 Europe/London"
            elif [ "$T" -gt 1737 ] && [ "$T" -le 1900 ]; then
              SCHEDULE_NOTE="18:00 Europe/London"
            else
              SCHEDULE_NOTE=""
            fi
          fi
          echo "SCHEDULE_NOTE=$SCHEDULE_NOTE" >> $GITHUB_ENV

          # Morning/evening from London hour (matches local cron buckets)
          HOUR=$(TZ=Europe/London date +%H)
          if [ "$HOUR" -lt 12 ]; then
            BLOCK="morning"
          else
            BLOCK="evening"
          fi
          echo "BLOCK=$BLOCK" >> $GITHUB_ENV

          PREFIX="${{ runner.os }}-previous-disruptions-${CACHE_DATE}-${BLOCK}-"
          COUNT=$(gh cache list --key "$PREFIX" --json id --jq '.[].id' | wc -l | tr -d ' ')
          if [ -z "$COUNT" ]; then COUNT=0; fi
          RUN_SLOT=$((COUNT + 1))
          echo "RUN_SLOT=$RUN_SLOT" >> $GITHUB_ENV
          echo "slot=$RUN_SLOT" >> $GITHUB_OUTPUT
          echo "block=$BLOCK" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}

      - name: Cache previous disruptions
        uses: actions/cache@v5
        id: cache
        with:
          path: previous_disruptions.json
          key: ${{ runner.os }}-previous-disruptions-${{ env.CACHE_DATE }}-${{ env.BLOCK }}-${{ env.RUN_SLOT }}
          restore-keys: |
            ${{ runner.os }}-previous-disruptions-${{ env.CACHE_DATE }}-${{ env.BLOCK }}-

      - name: Debug cache status
        run: |
          echo "Cache hit status: ${{ steps.cache.outputs.cache-hit }}"
          echo "Cache key: ${{ steps.cache.outputs.cache-primary-key }}"
          echo "Checking if previous_disruptions.json exists:"
          ls -la previous_disruptions.json || echo "File does not exist"
          if [ -f previous_disruptions.json ]; then
            echo "File contents:"
            cat previous_disruptions.json
          fi

      - name: Create empty previous disruptions file if not cached
        run: |
          if [ ! -f previous_disruptions.json ]; then
            echo "Cache miss - creating empty previous disruptions file"
            echo '[]' > previous_disruptions.json
          else
            echo "Cache hit - previous_disruptions.json already exists"
          fi

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: |
          echo "Debug: CACHE_DATE=$CACHE_DATE, BLOCK=$BLOCK, RUN_SLOT=$RUN_SLOT"
          echo "Debug: github.event.schedule=${{ github.event.schedule }} SCHEDULE_NOTE=$SCHEDULE_NOTE"
          node checkTflApi.js
        env:
          SLACK_BOT_TFL_TOKEN: ${{ secrets.SLACK_BOT_TFL_TOKEN }}
          SLACK_CHANNEL_TFL: ${{ secrets.SLACK_CHANNEL_TFL }}
          RUN_SLOT: ${{ env.RUN_SLOT }}
          BLOCK: ${{ env.BLOCK }}
          SCHEDULE_NOTE: ${{ env.SCHEDULE_NOTE }}

      - name: Save previous disruptions to cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: previous_disruptions.json
          key: ${{ runner.os }}-previous-disruptions-${{ env.CACHE_DATE }}-${{ env.BLOCK }}-${{ env.RUN_SLOT }}
          upload-chunk-size: 32MB

      - name: Delete cache for specific runs
        if: always() && env.RUN_SLOT == '3'
        run: |
          echo "Deleting all caches for ${{ env.BLOCK }} block..."
          CACHE_PREFIX="${{ runner.os }}-previous-disruptions-${{ env.CACHE_DATE }}-${{ env.BLOCK }}-"
          gh cache list --key "$CACHE_PREFIX" --json id --jq '.[].id' | while read -r cache_id; do
            echo "Deleting cache ID: $cache_id"
            gh cache delete "$cache_id"
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
